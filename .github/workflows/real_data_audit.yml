name: Real Data Research Audit

on:
  # RUN THE MORNING AFTER EACH SESSION, NOT THE SAME EVENING.
  #
  # The same-evening slot (23:38 IST) was measurably too early. Yahoo had not
  # posted the day's close even TEN HOURS after the 15:30 IST close: the 26 Aug
  # run, firing at 01:31 IST, saw a 26 Aug bar for 2 symbols out of 1,505. The
  # boundary logic was never wrong -- the run simply asked the provider before
  # it had the data, and fell back to the prior session every time. Diagnosis
  # credited to upstream (Pareshking/RS-Stages 6110bf8), independently
  # confirmed against this repo's own universe.
  #
  # 01:08 UTC is 06:38 IST the NEXT calendar day: about 15 hours of settling
  # instead of 8, and still comfortably before the 09:15 IST open, so the
  # snapshot remains a pre-market decision. Day-of-week shifts with it -- a
  # Monday session is picked up Tuesday morning, a Friday session on Saturday,
  # so Mon-Fri sessions need Tue-Sat runs.
  #
  # TWO SLOTS, AND NEITHER MINUTE IS ROUND. GitHub runs `schedule` on a
  # best-effort queue: delayed under load, and dropped outright when the queue
  # does not clear. Both happened here within two days -- 26 Aug fired 106
  # minutes late, and 27 Aug never fired at all, so that session was never
  # published and nothing reported a failure. On-the-hour and quarter-hour
  # minutes are the most contended, hence :08 and :23.
  #
  # The 02:23 run is a catch-up, not a second opinion, and deliberately NOT a
  # separate watchdog workflow: re-dispatching a workflow from a workflow needs
  # a personal access token, which expires, and a safety net that dies silently
  # when a credential lapses is worse than one extra idle run. The publish step
  # already exits cleanly when nothing changed, so a normal day costs seven
  # free minutes; a dropped-first-slot day it is the only thing that publishes.
  # It is still pre-market at 07:53 IST.
  #
  # There is no longer a Friday universe refresh to race: that workflow was
  # deleted, and tests/test_workflow_scheduling.py fails if one returns.
  #
  # THE 19:00 IST SLOT IS AN EXPERIMENT, AND THE PUBLISHED DATE IS ITS RESULT.
  # Measured 28 Aug 2026 at 18:57 IST: that day's own close was already carried
  # for 100% of a 120-symbol sample, 3.4 hours after the bell -- while the same
  # morning, the PREVIOUS day's close stood at 36% on a clean runner. Age alone
  # does not explain that, so the provider's pattern is not something to reason
  # about; it is something to measure. Running both times and comparing the
  # boundary each one publishes settles it with no analysis at all.
  #
  # Safe to run at several hours only because the boundary never regresses: a
  # run that lands at a thin hour publishes nothing rather than walking the
  # record back a session. Drop the losing slot once a week of dates has spoken.
  #
  # FIVE SLOTS BECAUSE GITHUB FIRES ABOUT ONE IN THREE. Measured across both this
  # repo and upstream: 2 scheduled runs ever here, 6 there, every one of them
  # late -- 41, 43, 46, 106 minutes, and one by 11.5 hours. Upstream's 06:30 IST
  # slot and ours both missed entirely on 29 Aug. The config is not the problem
  # and neither is the minute; the free scheduler simply drops runs.
  #
  # Four post-close slots spread over five hours, because the drops look
  # load-correlated rather than independent: our two morning slots sat 75 minutes
  # apart and died together. At a ~1-in-3 firing rate, five spread slots publish
  # a session same-day about 87% of the time against 33% for one.
  #
  # Extras are free because the boundary never regresses: whichever slot fires
  # first publishes, and every later one finds its own boundary no newer than
  # what is on disk and exits without writing. They cost a download, not a risk.
  schedule:
    - cron: "41 11 * * 1-5"     # 17:11 IST
    - cron: "37 13 * * 1-5"     # 19:07 IST
    - cron: "19 15 * * 1-5"     # 20:49 IST
    - cron: "3 17 * * 1-5"      # 22:33 IST
    - cron: "8 1 * * 2-6"       # 06:38 IST -- last resort, publishes the prior session
  workflow_dispatch:
    inputs:
      decision_date:
        description: 'Optional pre-market decision date (YYYY-MM-DD). Leave blank to use today in IST.'
        required: false
        type: string
      start_date:
        description: 'Optional Yahoo history start (YYYY-MM-DD). Leave blank for automatic warm-up history.'
        required: false
        type: string
      end_date:
        description: 'Optional Yahoo history end (YYYY-MM-DD, exclusive). Leave blank for automatic end date.'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  # The catch-up must QUEUE behind a late primary, never run beside it. Two
  # concurrent audits push the same branch; the loser is rejected and its whole
  # run is discarded. cancel-in-progress stays false because a half-finished
  # audit publishes nothing -- there is no partial result worth preferring.
  group: real-data-audit
  cancel-in-progress: false


env:
  # Rolling tag whose single asset is replaced on every run. Deliberately not a
  # source release: it carries generated data, never code.
  DATA_TAG: data-latest

jobs:
  audit:
    runs-on: ubuntu-latest
    # 1,532 symbols instead of 752: the download roughly doubles to ~3 hours.
    # GitHub's hard ceiling is 6 hours, so this leaves real headroom for a slow
    # provider day without letting a hung run burn the full allowance.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history: publishing rebases onto whatever landed while this run
          # was computing, and a depth-1 clone has no merge base to rebase onto.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run complete Nifty Total Market audit
        id: audit
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          mkdir -p data
          python scripts/real_data_audit.py \
            --universe data/ind_niftytotalmarket_list.csv \
            --decision-date '${{ inputs.decision_date }}' \
            --start '${{ inputs.start_date }}' \
            --end '${{ inputs.end_date }}' \
            --output data/latest_research.csv

      # The price panel is published as a release asset, never committed. It is a
      # regenerated binary that Git cannot delta, so committing it would add a
      # fresh ~1.4 MB blob to history on every run, permanently. Replacing a
      # single asset keeps exactly one copy and adds nothing to the repository.
      # GATED. A run that refuses to move the record backwards writes no price
      # panel, and `gh release upload` does not glob -- it fails with "no matches
      # found". So a correct no-op died at the next step and was reported as a
      # broken audit (29 Aug 2026). Everything downstream of the audit now asks
      # whether it actually produced artifacts instead of assuming it did.
      - name: Publish price panel as a release asset
        if: steps.audit.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$DATA_TAG" >/dev/null 2>&1; then
            gh release create "$DATA_TAG" \
              --title "Latest research price panel" \
              --notes "Rolling price panel for the RS-Stages terminal. Replaced by each Real Data Research Audit run; not a source release." \
              --latest=false
          fi
          gh release upload "$DATA_TAG" data/price_panel.npz --clobber
          echo "Published $(du -h data/price_panel.npz | cut -f1) panel to release $DATA_TAG"

      - name: Publish validated research snapshot
        if: steps.audit.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_research.csv \
                  data/previous_research.csv \
                  data/breadth_history.csv
          if git diff --cached --quiet; then
            echo "Validated research snapshot unchanged."
            exit 0
          fi
          git commit -m "data: publish validated research snapshot"

          # This job runs for about three minutes, so main can move underneath
          # it — a human commit, or the Friday universe refresh. A bare push is
          # then rejected non-fast-forward and the run dies at its very last
          # step, having *already* replaced the price panel on the release. The
          # published panel would sit one session ahead of the committed
          # snapshot, which is precisely the drift panel_matches() refuses to
          # draw through: the live terminal loses every chart until someone
          # re-runs by hand.
          #
          # The audit writes only the three research CSVs and the universe
          # refresh writes only the constituent list, so rebasing onto whatever
          # landed can never conflict.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Snapshot published on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase origin main
          done
          echo "Could not publish the research snapshot after 5 attempts." >&2
          exit 1

      - name: Upload research output
        if: steps.audit.outputs.published == 'true'
        # v5 runs on Node 24; v4 targets the deprecated Node 20.
        uses: actions/upload-artifact@v5
        with:
          name: real-data-audit-${{ inputs.decision_date || 'auto' }}
          path: |
            data/latest_research.csv
            data/previous_research.csv
            data/price_panel.npz
            data/breadth_history.csv
          retention-days: 30
