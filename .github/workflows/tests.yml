name: Quantitative Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Verify runtime dependency guard
        run: |
          python - <<'PY'
          import pyarrow
          from packaging.version import Version
          version = Version(pyarrow.__version__)
          print("PyArrow:", version)
          assert version < Version("25"), "PyArrow 25+ is not allowed in the Streamlit runtime"
          PY
      - name: Compile application and package
        run: python -m compileall -q app.py rs_stages tests scripts
      - name: Streamlit production smoke test
        run: |
          python -m streamlit run app.py --server.headless true --server.port 8501 > /tmp/streamlit.log 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          python - <<'PY'
          import time
          import urllib.request
          url = "http://127.0.0.1:8501/"
          last = None
          for _ in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          print("Streamlit HTTP server is healthy")
                          raise SystemExit(0)
              except Exception as exc:
                  last = exc
              time.sleep(1)
          print("Streamlit HTTP server did not become ready:", last)
          print(open("/tmp/streamlit.log", encoding="utf-8").read())
          raise SystemExit(1)
          PY
          sleep 3
          if grep -Eiq 'Traceback|AttributeError|ModuleNotFoundError|SyntaxError|ImportError' /tmp/streamlit.log; then
            cat /tmp/streamlit.log
            exit 1
          fi
          cat /tmp/streamlit.log
      - name: Run tests
        run: |
          # Workflow-run LOGS require admin rights to download, so on this repo a
          # red tick reads only as "Process completed with exit code 1" to anyone
          # without them -- which is how a failure here cost an afternoon of
          # guessing at a suite that passes on every developer machine.
          # ANNOTATIONS are public, so each failing test is echoed as one and the
          # next failure is legible from the API alone. --tb=line keeps the cause
          # on the same line as the location without pasting whole tracebacks.
          set -o pipefail
          status=0
          python -m pytest -q -rf --tb=line 2>&1 | tee "$RUNNER_TEMP/pytest.log" || status=$?
          if [ "$status" -ne 0 ]; then
            grep -E "^(FAILED|ERROR)|\.py:[0-9]+: " "$RUNNER_TEMP/pytest.log"               | head -40 | while IFS= read -r line; do echo "::error::$line"; done
            echo "::error::summary: $(tail -n 1 "$RUNNER_TEMP/pytest.log")"
          fi
          exit "$status"
